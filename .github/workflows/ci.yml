name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - uses: actions/upload-artifact@v4
        with:
          name: pid-card
          path: packages/ha-card/dist/pid-card.js
      # A v* tag publishes the card as a release asset, which is where HACS installs it from.
      - name: Check the tag matches the card version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./packages/ha-card/package.json'); if (p.version !== '$v') { console.error('package.json is ' + p.version + ', tag is $v'); process.exit(1) }"
          grep -q "CARD_VERSION = '$v'" packages/ha-card/src/pid-card.ts || { echo "CARD_VERSION does not match $v"; exit 1; }
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/ha-card/dist/pid-card.js --title "$GITHUB_REF_NAME" --generate-notes

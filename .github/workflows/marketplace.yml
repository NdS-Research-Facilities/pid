name: Marketplace (formerly known as HACS) validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  # The validator of the Marketplace (formerly known as HACS); the action keeps its old name.
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
